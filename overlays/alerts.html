<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Satronho · Alertas</title>
<meta name="author" content="RiddsSatronho">
<!-- Overlay para OBS: agrégalo como "Fuente de navegador" de 800x300.
     El estilo se cambia en la app (Overlays para OBS). Parámetros opcionales:
     ?sound=0 (sin sonido) · ?scale=1.5 (más grande) · ?color=%23ffb23e -->
<link rel="stylesheet" href="base.css">
<style>
  :root { --accent: #ffb23e; --follow: #8b7bff; --sub: #ffb23e; --gift: #ff5d8f; --like: #4fd1c5; --share: #5ab0ff; --sticker: #c084fc; --join: #74d14c; --superfan: #ffd23e; --live-start: #ff4d6a; --live-end: #9b8cff; }
  /* Stickers: saltan al instante, sin cola, en cualquier parte del escenario. */
  .pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; display: grid; justify-items: center; gap: 4px; animation: stick 2.2s cubic-bezier(.2, 1.5, .4, 1) both; }
  .pop img { width: calc(110px * var(--scale, 1)); height: calc(110px * var(--scale, 1)); object-fit: contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
  .pop span { font-weight: 800; font-size: 18px; padding: 3px 12px; border-radius: 99px; background: var(--bg); color: var(--fg, #fff); border: 2px solid var(--sticker); white-space: nowrap; }
  @keyframes stickIn { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 60% { opacity: 1; transform: scale(1.15) rotate(8deg); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes stick { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 18% { opacity: 1; transform: scale(1.15) rotate(8deg); } 28% { transform: scale(1) rotate(0); } 80% { opacity: 1; transform: translateY(-10px); } 100% { opacity: 0; transform: translateY(-60px) scale(.9); } }
  body { height: 100vh; display: grid; place-items: center; }
  .stage { transform: scale(var(--scale, 1)); }
  .alert {
    --c: var(--follow);
    display: flex; align-items: center; gap: 22px;
    min-width: 520px; max-width: 720px;
    padding: 22px 30px 22px 22px;
    background: var(--bg);
    border-radius: calc(22px * var(--r));
    border: 2px solid color-mix(in srgb, var(--c) 70%, transparent);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 18%, transparent), 0 18px 50px rgba(0,0,0,.45);
    animation: enter .6s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  body[data-alert-colors="accent"] .alert { --c: var(--accent) !important; }
  .alert.leaving { animation: leave .45s ease-in both; }
  .alert.big { --c: var(--gift); animation: enter .6s cubic-bezier(.2, 1.4, .4, 1) both, glow 1.4s .6s ease-in-out infinite alternate; }
  .alert.big .title { font-size: 40px; }
  .alert.big.leaving { animation: leave .45s ease-in both; }
  @keyframes glow { to { box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 30%, transparent), 0 0 60px color-mix(in srgb, var(--c) 55%, transparent), 0 18px 50px rgba(0,0,0,.45); } }
  .badge {
    flex: none; width: 76px; height: 76px; border-radius: calc(38px * var(--r) + 4px);
    display: grid; place-items: center;
    background: var(--c); color: #140f22;
    font-size: 38px; font-weight: 800;
    animation: pop .9s .25s ease-out both;
  }
  .label { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--c); font-weight: 800; }
  .title { font-size: 34px; font-weight: 800; line-height: 1.1; margin-top: 2px; }
  .title b { color: var(--c); }
  .msg { font-size: 19px; margin-top: 6px; font-weight: 600; }
  .bar { height: 4px; border-radius: 4px; background: var(--c); margin-top: 12px; transform-origin: left; animation: shrink linear both; }
  @keyframes enter { from { opacity: 0; transform: translateY(40px) scale(.9); } }
  @keyframes leave { to { opacity: 0; transform: translateY(-30px) scale(.95); } }
  @keyframes pop { 0% { transform: scale(.4) rotate(-20deg); } 60% { transform: scale(1.15) rotate(6deg); } }
  @keyframes shrink { to { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="pops" id="pops"></div>

<script type="module">
  import { connectSatronho, param } from './client.js';
  import { applyOverlayStyle, overlayStyle, listenPreview, isPreview } from './style.js';
  import { playAlertSound, stopAlertSound } from './sounds.js';

  const stage = document.getElementById('stage');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const soundOn = () => param('sound', '1') !== '0' && overlayStyle().sound !== false && !isPreview;

  const TEMPLATES = {
    follow: { icon: '♥', label: 'Nuevo seguidor', title: (e) => `<b>${e.user.name}</b> te sigue` },
    sub:    { icon: '★', label: 'Suscripción',   title: (e) => `<b>${e.user.name}</b> se suscribió${e.amount > 1 ? ` · ${e.amount} meses` : ''}` },
    gift:   { icon: '🎁', label: 'Regalo',        title: (e) => {
      const x = e.extra || {};
      const what = x.giftName ? `${x.count > 1 ? `${x.count}× ` : ''}${esc(x.giftName)}` : `${e.amount} ${esc(x.currency || '')}`;
      return `<b>${e.user.name}</b> envió ${what}`;
    } },
    like:   { icon: '👍', label: 'Likes',         title: (e) => `<b>${e.user.name}</b> dio ${e.amount} likes` },
    share:  { icon: '↗', label: 'Compartido',    title: (e) => `<b>${e.user.name}</b> compartió el directo` },
    sticker: { icon: '✨', label: 'Sticker',       title: (e) => `<b>${e.user.name}</b>` },
    join:   { icon: '👋', label: 'Llegó',          title: (e) => `<b>${e.user.name}</b> llegó al directo` },
    superfan: { icon: '⭐', label: '¡Superfan!',   title: (e) => `<b>${e.user.name}</b> ahora es superfan` },
    'live-start': { icon: '🔴', label: 'En vivo',  title: () => '¡Empezó el directo!' },
    'live-end': { icon: '⏹', label: 'Fin',        title: () => 'Gracias por acompañarme' },
  };
  const okImg = (u) => /^(https:\/\/|\/gift-img\?|\/alert-sounds\/|\/alert-img\/)/.test(u || '');

  // Sticker o alerta instantánea: sonido ya y un salto en pantalla.
  async function instant(e) {
    if (soundOn()) playAlertSound(e.sound || { sound: 'burbuja' });
    const pops = document.getElementById('pops');
    const el = document.createElement('div');
    el.className = 'pop';
    const still = param('still', '') === '1';
    el.style.left = still ? '38%' : `${8 + Math.random() * 74}%`;
    el.style.top = still ? '22%' : `${14 + Math.random() * 52}%`;
    if (still) el.style.animation = 'stick 1.2s cubic-bezier(.2, 1.5, .4, 1) both paused', el.style.animationPlayState = 'running', el.style.animationIterationCount = '1', el.style.animationFillMode = 'forwards', el.style.animationName = 'stickIn';
    if (e.color) el.style.setProperty('--sticker', e.color);
    const img = okImg(e.image) ? `<img src="${esc(e.image)}" alt="">` : `<div style="font-size:72px">${(TEMPLATES[e.type] || TEMPLATES.sticker).icon}</div>`;
    el.innerHTML = `${img}<span>${esc(e.custom ? e.title : e.user?.name || '')}</span>`;
    pops.append(el);
    while (pops.children.length > 12) pops.firstChild.remove();
    if (!still) setTimeout(() => el.remove(), 2300);
  }

  // Cola: las alertas salen de una en una, nunca se pisan.
  const queue = [];
  let busy = false;

  function enqueue(e) {
    // Solo sonido (sonidos del chat, pruebas o alertas sin nada en pantalla).
    if (e.soundOnly) { if (soundOn()) playAlertSound(e.sound || { sound: 'campanita' }); return; }
    if (e.instant) return instant(e);
    if (!TEMPLATES[e.type] && !e.custom) return;
    queue.push(e);
    if (!busy) next();
  }

  async function next() {
    const e = queue.shift();
    if (!e) { busy = false; return; }
    busy = true;

    const t = TEMPLATES[e.type] || { icon: '✦', label: 'Alerta', title: (x) => `<b>${x.user.name}</b>` };
    const safe = { ...e, user: { ...e.user, name: esc(e.user?.name || '') } };

    // El sonido arranca con la alerta; si «dura lo que dura el sonido»,
    // la alerta se queda en pantalla hasta que termina (mínimo 2 s).
    const soundLen = soundOn() ? await playAlertSound(e.sound || { sound: 'campanita' }) : 0;
    let dur = e.durationMs || 5000;
    if (e.fitSound && soundLen) dur = Math.max(2000, Math.round(soundLen * 1000) + 400);

    const el = document.createElement('div');
    el.className = `alert surface${e.big ? ' big' : ''}`;
    el.style.setProperty('--c', e.color || `var(--${e.type})`);
    // Si el regalo trae imagen, la usamos como insignia (copiada en tu PC).
    const src = okImg(e.image) ? e.image : /^https:\/\//.test(e.extra?.image || '') ? e.extra.image : '';
    const img = src ? `<img src="${esc(src)}" alt="" style="width:62px;height:62px;object-fit:contain">` : t.icon;
    el.innerHTML = `
      <div class="badge">${img}</div>
      <div>
        <div class="label">${e.custom ? esc(e.label) : e.big ? '¡Regalo grande!' : t.label}</div>
        <div class="title">${e.custom ? esc(e.title).replace(esc(e.user?.name || '\u0000'), `<b>${esc(e.user?.name || '')}</b>`) : t.title(safe)}</div>
        ${e.message ? `<div class="msg muted">${esc(e.message)}</div>` : ''}
        <div class="bar" style="animation-duration:${dur}ms"></div>
      </div>`;
    stage.replaceChildren(el);

    setTimeout(() => {
      if (!el.isConnected) return; // la cortaron desde la app
      el.classList.add('leaving');
      setTimeout(() => { el.remove(); next(); }, 450);
    }, dur);
  }

  // Vista previa en la app: una alerta de ejemplo que se repite.
  const DEMO = [
    { type: 'follow', user: { name: 'Rosalinda' }, durationMs: 3200 },
    { type: 'gift', user: { name: 'DJ_Fan' }, amount: 5, extra: { giftName: 'Rosa', count: 5 }, durationMs: 3200 },
    { type: 'sub', user: { name: 'SuscriptorFiel' }, amount: 3, durationMs: 3200 },
  ];
  let demoI = 0;
  const demo = () => { if (!busy) enqueue(DEMO[demoI++ % DEMO.length]); };
  listenPreview(demo);
  // ?still=1: vista previa del editor (sin demo; muestra la alerta que le mandan).
  let demoTimer = null;
  if (isPreview && param('still', '') !== '1') { demo(); demoTimer = setInterval(demo, 4200); }
  window.addEventListener('message', (ev) => {
    if (ev.origin !== location.origin || !ev.data?.satronhoAlert) return;
    clearInterval(demoTimer);
    queue.length = 0;
    stage.replaceChildren();
    document.getElementById('pops').replaceChildren();
    busy = false;
    enqueue({ ...ev.data.satronhoAlert, durationMs: 60000 });
  });

  applyOverlayStyle({});
  // Si este overlay suena, la app no repite el sonido (si no hay ninguno abierto, suena en la app).
  let conn = null;
  const announce = () => { if (!isPreview && param('sound', '1') !== '0') conn?.send({ kind: 'alerts-hello' }); };
  conn = connectSatronho((kind, payload) => {
    if (kind === 'hello') { applyOverlayStyle(payload.overlayStyle); announce(); }
    if (kind === 'overlay-style') applyOverlayStyle(payload);
    if (kind === 'alert' && !isPreview) enqueue(payload);
    // Desde la barra derecha de la app: cortar la que suena o vaciar la cola.
    if (kind === 'alert-control' && !isPreview) {
      queue.length = payload.action === 'clear' ? 0 : queue.length;
      stopAlertSound?.();
      const cur = stage.firstElementChild;
      if (cur) { cur.remove(); busy = false; next(); }
      document.getElementById('pops').replaceChildren();
    }
  });
</script>
</body>
</html>
