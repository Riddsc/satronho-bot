<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Satronho · Ruleta</title>
<meta name="author" content="RiddsSatronho">
<!-- Overlay de las ruletas: /overlays/wheel.html
     Fuente de navegador recomendada: 720 × 860. Se escala sola a cualquier tamaño.
     ?wheel=<id>  solo muestra esa ruleta (para tener una fuente por ruleta).
     ?idle=show   deja la última ruleta a la vista entre tiradas (si no, se esconde).
     ?sound=0     sin sonidos (clavijas y premio). -->
<link rel="stylesheet" href="base.css">
<style>
  :root { --W: 720px; --H: 860px; --c: #ffb23e; }
  body { width: 100vw; height: 100vh; }
  #fit { position: fixed; left: 50%; top: 50%; width: var(--W); height: var(--H); transform: translate(-50%, -50%) scale(var(--fit, 1)); transform-origin: center; }
  #stage { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; justify-items: center; opacity: 0; transform: scale(.86) translateY(20px); transition: opacity .45s ease, transform .55s cubic-bezier(.2, 1.4, .4, 1); }
  #stage.on { opacity: 1; transform: none; }

  /* Título: nombre de la ruleta y quién la gira */
  .head { margin-top: 6px; padding: 10px 22px 12px; border-radius: calc(22px * var(--r)); background: var(--bg); text-align: center; min-width: 360px; max-width: 680px; box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .head h1 { margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: -.01em; }
  .head p { margin: 4px 0 0; font-size: 21px; font-weight: 700; }
  .head p b { color: var(--accent); }
  .head .why { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 99px; font-size: 15px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); vertical-align: 2px; }
  .head .chain { display: block; font-size: 14px; opacity: .75; margin-bottom: 2px; }
  body.notitle .head { visibility: hidden; }

  /* Ruleta */
  .wheel-box { position: relative; width: 640px; height: 640px; align-self: center; }
  canvas { position: absolute; inset: 0; width: 640px; height: 640px; }
  /* Puntero arriba, con la lengüeta que rebota en cada clavija */
  .pointer { position: absolute; left: 50%; top: -6px; width: 56px; height: 74px; margin-left: -28px; transform-origin: 50% 18px; z-index: 3; filter: drop-shadow(0 5px 6px rgba(0,0,0,.45)); }

  /* Mascota en el centro (gira con la ruleta y se marea) */
  .pet { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; z-index: 4; pointer-events: none; }
  .pet .rot { position: absolute; inset: 0; transform-origin: 50% 55%; }
  .pet .bob { position: absolute; inset: 0; transform-origin: 50% 85%; }
  .pet svg { width: 100%; height: 100%; overflow: visible; }
  .pet .dizzy-eyes, .pet .stars, .pet .sweat { opacity: 0; transition: opacity .25s; }
  .pet.dizzy .dizzy-eyes, .pet.dizzy .stars, .pet.woozy .dizzy-eyes, .pet.woozy .stars { opacity: 1; }
  .pet .spiral { transform-box: fill-box; transform-origin: center; animation: spiral .5s linear infinite; }
  .pet .stars { transform-origin: 50px 18px; animation: orbit 1.1s linear infinite; }
  .pet.woozy .bob { animation: woozy 1.4s ease-in-out both; }
  .pet.happy .bob { animation: hop .55s cubic-bezier(.3, 1.6, .5, 1) 3; }
  .pet.scared .bob { animation: shake .09s linear 10; }
  .pet.scared .sweat { opacity: 1; }
  .pet.surprised .bob { animation: hop .4s cubic-bezier(.3, 1.6, .5, 1) 2; }
  .pet.enter .bob { animation: popin .6s cubic-bezier(.2, 1.6, .4, 1) both; }
  .pet .green { opacity: 0; transition: opacity .4s; }
  .pet.dizzy .green, .pet.woozy .green { opacity: .8; }
  @keyframes spiral { to { transform: rotate(360deg); } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes woozy { 0% { transform: rotate(0); } 18% { transform: rotate(-14deg) translateX(-6px); } 38% { transform: rotate(12deg) translateX(6px); } 58% { transform: rotate(-8deg); } 78% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-34px) scale(1.06, .96); } 70% { transform: translateY(0) scale(1.1, .88); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-3deg); } 75% { transform: translateX(5px) rotate(3deg); } }
  @keyframes popin { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }

  /* Tarjeta del ganador */
  .win { position: absolute; left: 50%; bottom: 8px; translate: -50% 0; z-index: 5; min-width: 420px; max-width: 690px; padding: 14px 24px 16px; border-radius: calc(24px * var(--r)); background: var(--bg); border: 3px solid var(--c); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 25%, transparent), 0 16px 36px rgba(0,0,0,.45); text-align: center; opacity: 0; transform: translateY(30px) scale(.8); transition: opacity .3s, transform .5s cubic-bezier(.2, 1.6, .4, 1); }
  .win.on { opacity: 1; transform: none; }
  .win small { display: block; font-size: 19px; font-weight: 800; letter-spacing: .02em; }
  .win small b { color: var(--accent); }
  .win .prize { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; font-size: 40px; font-weight: 900; line-height: 1.05; }
  .win .prize i { font-style: normal; font-size: 50px; }
  .win .prize img { width: 56px; height: 56px; object-fit: contain; }
  .win .tag { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 99px; font-size: 16px; font-weight: 800; background: color-mix(in srgb, var(--c) 30%, transparent); }
  #confetti { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .queue { position: absolute; right: 8px; top: 8px; padding: 4px 12px; border-radius: 99px; background: var(--bg); font-size: 16px; font-weight: 800; opacity: 0; transition: opacity .3s; }
  .queue.on { opacity: 1; }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <div class="head surface"><h1 id="w-name">Ruleta</h1><p id="w-who"></p></div>
    <div class="wheel-box">
      <canvas id="cv" width="640" height="640"></canvas>
      <svg class="pointer" id="pointer" viewBox="0 0 56 74" aria-hidden="true">
        <defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#f2b33d"/></linearGradient></defs>
        <circle cx="28" cy="18" r="16" fill="url(#pg)" stroke="#7a4a07" stroke-width="3"/>
        <path d="M14 26 L28 70 L42 26 Z" fill="url(#pg)" stroke="#7a4a07" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="28" cy="18" r="6" fill="#7a4a07"/>
      </svg>
      <div class="pet" id="pet" hidden><div class="rot" id="pet-rot"><div class="bob" id="pet-svg"></div></div></div>
    </div>
    <div class="win surface" id="win"><small id="win-who"></small><div class="prize" id="win-prize"></div><span class="tag" id="win-tag" hidden></span></div>
  </div>
  <canvas id="confetti" width="720" height="860"></canvas>
  <div class="queue" id="queue"></div>
</div>
<script type="module">
  import { connectSatronho, param } from './client.js';
  import { applyOverlayStyle, listenPreview, isPreview } from './style.js';
  import { playAlertSound } from './sounds.js';
  import { mascotSVG } from '/js/mascots.js';

  const onlyWheel = param('wheel', '');
  const idleShow = param('idle', '') === 'show' || isPreview;
  const soundOk = () => param('sound', '1') !== '0' && !isPreview || window.__wheelSound;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Escala: el diseño mide 720 × 860 y llena la fuente sin deformarse.
  function fit() { document.documentElement.style.setProperty('--fit', String(Math.min(innerWidth / 720, innerHeight / 860))); }
  addEventListener('resize', fit); fit();

  // ---------- Paletas ----------
  const PALETTES = {
    premio: ['#ff5d8f', '#ffb23e', '#5ab0ff', '#74d14c', '#c084fc', '#4fd1c5', '#ff7a4d', '#ffd23e'],
    neon: ['#ff2e88', '#00e5ff', '#b6ff00', '#ff9f1c', '#9d4dff', '#00ffa3'],
    pastel: ['#ffb6d9', '#ffd8a8', '#b5e8ff', '#c9f2c7', '#e3c9ff', '#fff3a8'],
    caramelo: ['#e8901c', '#fff3e2', '#a95a2f', '#ffcf8a', '#5a2e12', '#ffb23e'],
    noche: ['#2c1a5c', '#f4c95d', '#3d2a80', '#9b8cff', '#1a1036', '#ffd23e'],
    mar: ['#0f766e', '#4fd1c5', '#134e4a', '#99f6e4', '#115e59', '#2dd4bf'],
  };
  const textOn = (hex) => {
    const h = hex.replace('#', '');
    const n = h.length === 3 ? h.split('').map((c) => parseInt(c + c, 16)) : [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
    return (n[0] * 299 + n[1] * 587 + n[2] * 114) / 1000 > 150 ? '#2a1a10' : '#ffffff';
  };
  const colorOf = (w, i) => w.prizes[i].color || (PALETTES[w.look?.palette] || PALETTES.premio)[i % (PALETTES[w.look?.palette] || PALETTES.premio).length];

  // ---------- Dibujo de la ruleta ----------
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  const DPR = Math.min(2, devicePixelRatio || 1) * 1.5;
  cv.width = 640 * DPR; cv.height = 640 * DPR;
  ctx.scale(DPR, DPR);
  const C = 320, R = 300;
  let wheel = null;
  let rot = 0; // radianes
  let speed = 0; // vueltas por segundo (para luces y mareo)
  const imgs = new Map();
  const imgOf = (src) => {
    if (!src) return null;
    if (!imgs.has(src)) { const im = new Image(); im.onload = () => draw(); im.src = src.startsWith('/') ? src : `/gift-img?u=${encodeURIComponent(src)}`; imgs.set(src, im); }
    const im = imgs.get(src);
    return im.complete && im.naturalWidth ? im : null;
  };
  const font = () => getComputedStyle(document.documentElement).getPropertyValue('--font') || 'system-ui';

  function draw(t = performance.now()) {
    ctx.clearRect(0, 0, 640, 640);
    if (!wheel) return;
    const n = wheel.prizes.length;
    const seg = (Math.PI * 2) / n;
    // Sombra y aro dorado
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
    ctx.beginPath(); ctx.arc(C, C, R + 12, 0, Math.PI * 2);
    const rim = ctx.createLinearGradient(0, 0, 640, 640);
    rim.addColorStop(0, '#fff1c2'); rim.addColorStop(0.45, '#f2b33d'); rim.addColorStop(1, '#a8670e');
    ctx.fillStyle = rim; ctx.fill();
    ctx.restore();

    // Casillas
    for (let i = 0; i < n; i += 1) {
      const a0 = rot + i * seg - Math.PI / 2;
      const col = colorOf(wheel, i);
      ctx.beginPath(); ctx.moveTo(C, C); ctx.arc(C, C, R - 6, a0, a0 + seg); ctx.closePath();
      const g = ctx.createRadialGradient(C, C, 40, C, C, R);
      g.addColorStop(0, col); g.addColorStop(1, shade(col, -18));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
      // Texto a lo largo del radio
      const p = wheel.prizes[i];
      ctx.save();
      ctx.translate(C, C); ctx.rotate(a0 + seg / 2);
      // En la mitad izquierda el texto se voltea para no leerse de cabeza.
      const mid = (((a0 + seg / 2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const flip = mid > Math.PI / 2 && mid < Math.PI * 1.5;
      ctx.fillStyle = textOn(col); ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
      const im = imgOf(p.image);
      const label = p.label || '';
      let size = Math.min(30, Math.max(14, (seg * R) / 3.2));
      ctx.font = `800 ${size}px ${font()}`;
      // Espacio entre el borde y el centro (sin taparse con la mascota).
      const room = () => (R - 26) - 96 - (im ? Math.min(46, size * 1.6) + 8 : p.emoji ? size * 1.55 + 8 : 0);
      while (ctx.measureText(label).width > room() && size > 12) { size -= 1; ctx.font = `800 ${size}px ${font()}`; }
      const maxW = room();
      let text = label;
      while (ctx.measureText(text).width > maxW && text.length > 3) text = `${text.slice(0, -2)}…`;
      // El emoji o la imagen va junto al borde; el nombre, hacia el centro.
      const iconW = im ? Math.min(46, size * 1.6) : p.emoji ? size * 1.55 : 0;
      if (flip) { ctx.rotate(Math.PI); ctx.textAlign = 'left'; }
      const edge = flip ? -(R - 26) : R - 26;
      const dir = flip ? 1 : -1; // hacia el centro
      if (im) { const s2 = iconW; ctx.drawImage(im, flip ? edge : edge - s2, -s2 / 2, s2, s2); }
      else if (p.emoji) { ctx.font = `${Math.round(size * 1.25)}px "Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(p.emoji, edge, 1); ctx.font = `800 ${size}px ${font()}`; }
      ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 3;
      ctx.fillText(text, edge + dir * (iconW ? iconW + 8 : 0), 1);
      ctx.restore();
    }
    // Clavijas en los bordes de cada casilla
    for (let i = 0; i < n; i += 1) {
      const a = rot + i * seg - Math.PI / 2;
      const x = C + Math.cos(a) * (R - 14), y = C + Math.sin(a) * (R - 14);
      ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff8e1'; ctx.fill(); ctx.strokeStyle = '#a8670e'; ctx.lineWidth = 2; ctx.stroke();
    }
    // Bombillos del aro: en reposo parpadean suave; girando, hacen carrera.
    const bulbs = 28;
    for (let i = 0; i < bulbs; i += 1) {
      const a = (i / bulbs) * Math.PI * 2;
      const x = C + Math.cos(a) * (R + 4), y = C + Math.sin(a) * (R + 4);
      const chase = speed > 0.05 ? (Math.floor(t / Math.max(40, 160 - speed * 60)) + i) % 3 === 0 : ((Math.floor(t / 520) + i) % 2 === 0);
      ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = chase ? '#fffbe6' : '#c98a1e';
      if (chase) { ctx.shadowColor = '#fff3b0'; ctx.shadowBlur = 14; }
      ctx.fill(); ctx.shadowBlur = 0;
    }
    // Centro
    ctx.beginPath(); ctx.arc(C, C, 82, 0, Math.PI * 2);
    const hub = ctx.createRadialGradient(C - 20, C - 24, 10, C, C, 82);
    hub.addColorStop(0, '#fffaf0'); hub.addColorStop(1, '#f0c46a');
    ctx.fillStyle = hub; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#a8670e'; ctx.stroke();
  }
  function shade(hex, pct) {
    const h = hex.replace('#', '');
    const n = h.length === 3 ? h.split('').map((c) => parseInt(c + c, 16)) : [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
    return `rgb(${n.map((v) => Math.max(0, Math.min(255, Math.round(v + (pct / 100) * 255)))).join(',')})`;
  }

  // ---------- Sonido de clavija (sintetizado, cortito) ----------
  let ac = null;
  function tick(vol) {
    try {
      ac ||= new AudioContext();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = 1800 + Math.random() * 400;
      g.gain.setValueAtTime(vol * 0.35, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.05);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.06);
    } catch { /* sin audio */ }
  }

  // ---------- Mascota ----------
  const pet = $('pet');
  // Ojos en espiral y estrellitas encima del dibujo (mismas coordenadas que mascots.js).
  const EXTRA = `
    <g class="green"><ellipse cx="30" cy="66" rx="8" ry="5" fill="#7bd36b"/><ellipse cx="70" cy="66" rx="8" ry="5" fill="#7bd36b"/></g>
    <g class="dizzy-eyes">${[38.3, 61.7].map((x) => `<g transform="translate(${x} 55.7)"><circle r="6.6" fill="#fff"/><path class="spiral" d="M0 0 m0 -1 a1 1 0 1 1 -1 1 a2 2 0 1 1 2 2 a3 3 0 1 1 -3 -3 a4.4 4.4 0 1 1 4.4 4.4" fill="none" stroke="#1c1a22" stroke-width="1.5" stroke-linecap="round"/></g>`).join('')}</g>
    <g class="stars">${[0, 120, 240].map((d) => `<g transform="rotate(${d} 50 18) translate(50 -6)"><path d="M0 -6 L1.8 -1.8 L6 0 L1.8 1.8 L0 6 L-1.8 1.8 L-6 0 L-1.8 -1.8 Z" fill="#ffd23e" stroke="#a8670e" stroke-width=".8"/></g>`).join('')}</g>
    <g class="sweat"><path d="M80 34 C84 42 86 46 82 48 C78 49 77 44 80 34 Z" fill="#7cc7ff" stroke="#2a6fb0" stroke-width="1"/></g>`;
  function setPet(id) {
    if (!id || id === 'none') { pet.hidden = true; return; }
    pet.hidden = false;
    $('pet-svg').innerHTML = mascotSVG(id, id).replace('</svg>', `${EXTRA}</svg>`);
  }
  function petState(cls) {
    pet.className = `pet ${cls || ''}`;
  }

  // ---------- Confeti ----------
  const cf = $('confetti');
  const cx = cf.getContext('2d');
  let bits = [];
  function confetti(colors) {
    for (let i = 0; i < 140; i += 1) {
      bits.push({ x: 360, y: 430, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, s: 6 + Math.random() * 7, c: colors[i % colors.length], life: 0 });
    }
  }
  function stepConfetti() {
    cx.clearRect(0, 0, 720, 860);
    bits = bits.filter((b) => b.life < 160 && b.y < 900);
    for (const b of bits) {
      b.life += 1; b.vy += 0.38; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.globalAlpha = Math.max(0, 1 - b.life / 160);
      cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore();
    }
  }

  // ---------- Animación del giro ----------
  let anim = null; // { from, to, start, dur, spin }
  let lastPeg = 0;
  let flap = 0;
  let hideTimer = null;
  let currentSpin = null;

  function frame(t) {
    if (anim) {
      const k = Math.min(1, (t - anim.start) / anim.dur);
      // Arranca de golpe, frena largo y con suspenso al final.
      const e = 1 - Math.pow(1 - k, 4.2);
      const prev = rot;
      rot = anim.from + (anim.to - anim.from) * e;
      speed = Math.abs(rot - prev) / (Math.PI * 2) * 60;
      const n = wheel.prizes.length;
      const seg = (Math.PI * 2) / n;
      const peg = Math.floor(rot / seg);
      if (peg !== lastPeg) {
        lastPeg = peg;
        flap = Math.min(28, 10 + speed * 6);
        if (wheel.look?.ticks !== false && soundOk()) tick(Math.max(0.15, (wheel.look?.volume ?? 70) / 100));
      }
      // La mascota gira pegada al centro; al frenar se endereza poco a poco.
      const upright = k < 0.7 ? 0 : Math.min(1, (k - 0.7) / 0.3);
      $('pet-rot').style.transform = `rotate(${(rot * (1 - upright)) % (Math.PI * 2)}rad)`;
      if (speed > 0.35) pet.classList.add('dizzy');
      if (k >= 1) { const a = anim; anim = null; speed = 0; landed(a.spin); }
    }
    flap *= 0.82;
    $('pointer').style.transform = `rotate(${-flap}deg)`;
    draw(t);
    if (bits.length) stepConfetti();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function show(on) {
    clearTimeout(hideTimer);
    $('stage').classList.toggle('on', on);
  }

  function startSpin(spin) {
    if (onlyWheel && spin.wheelId !== onlyWheel) return;
    currentSpin = spin;
    wheel = spin.wheel;
    const n = wheel.prizes.length;
    const seg = (Math.PI * 2) / n;
    document.body.classList.toggle('notitle', wheel.look?.title === false);
    $('fit').style.setProperty('--wsize', String((wheel.look?.size || 100) / 100));
    $('w-name').textContent = wheel.name;
    $('w-who').innerHTML = `${spin.parent ? `<span class="chain">↳ desde «${esc(spin.parent)}»</span>` : ''}Gira: <b>${esc(spin.user?.name || '')}</b>${spin.reason ? `<span class="why">${esc(spin.reason)}</span>` : ''}`;
    $('win').classList.remove('on');
    setPet(spin.mascot);
    petState('enter');
    show(true);
    // Destino: la casilla elegida bajo el puntero, con varias vueltas.
    const target = -((spin.index + (spin.jitter ?? 0.5)) * seg);
    const base = rot % (Math.PI * 2);
    let delta = (target - base) % (Math.PI * 2);
    if (delta < 0) delta += Math.PI * 2;
    rot = base;
    lastPeg = Math.floor(rot / seg);
    const dur = Math.max(1500, (spin.spinMs || 7000) - 200);
    setTimeout(() => {
      if (currentSpin !== spin) return;
      petState('');
      anim = { from: rot, to: rot + (spin.turns || 6) * Math.PI * 2 + delta, start: performance.now(), dur: dur - 400, spin };
    }, 400);
  }

  function landed(spin) {
    if (currentSpin !== spin) return;
    const p = spin.wheel.prizes[spin.index];
    const col = colorOf(spin.wheel, spin.index);
    $('win').style.setProperty('--c', col);
    $('win-who').innerHTML = `🎉 <b>${esc(spin.user?.name || '')}</b> ganó`;
    const im = p.image ? `<img src="${esc(p.image.startsWith('/') ? p.image : `/gift-img?u=${encodeURIComponent(p.image)}`)}" alt="">` : p.emoji ? `<i>${esc(p.emoji)}</i>` : '';
    $('win-prize').innerHTML = `${im}<span>${esc(p.label)}</span>`;
    const tag = spin.result?.reto ? '¡Reto pendiente!' : '';
    $('win-tag').hidden = !tag; $('win-tag').textContent = tag;
    $('win').classList.add('on');
    // Mareada un ratito, y luego reacciona al premio.
    $('pet-rot').style.transform = 'rotate(0rad)';
    petState('woozy');
    setTimeout(() => {
      if (currentSpin !== spin) return;
      const react = spin.result?.reto ? 'scared' : spin.result?.again ? 'surprised' : 'happy';
      petState(react);
      if (react === 'happy') confetti([col, '#ffd23e', '#ffffff', '#ff5d8f', '#5ab0ff']);
    }, 1400);
    if (soundOk() && spin.wheel.look?.winSound && spin.wheel.look.winSound !== 'none') playAlertSound({ sound: spin.wheel.look.winSound, volume: spin.wheel.look.volume ?? 70, maxSeconds: 6 });
    if (!idleShow) hideTimer = setTimeout(() => { if (currentSpin === spin) show(false); }, Math.max(1500, spin.showMs || 5000));
  }

  // ---------- Vista previa en la app ----------
  const DEMO = { name: 'Ruleta de premios', prizes: [
    { label: 'Saludo especial', emoji: '👋' }, { label: 'Elige canción', emoji: '🎵' }, { label: '+5 minutos', emoji: '⏱️' },
    { label: 'Reto: sentadillas', emoji: '🏋️' }, { label: 'Gira otra vez', emoji: '🔁' }, { label: 'Abrazo virtual', emoji: '🤗' },
  ], look: { mascot: 'random', palette: 'premio', spinSeconds: 6, showSeconds: 3 } };
  const PETS = ['samy', 'troya', 'nono', 'juana'];
  let previewWheel = DEMO;
  function demoSpin(w = previewWheel) {
    if (!w?.prizes?.length) return;
    const index = Math.floor(Math.random() * w.prizes.length);
    const mascots = w.look?.mascots?.length ? w.look.mascots : PETS;
    const mascot = !w.look?.mascot || w.look.mascot === 'random' ? mascots[Math.floor(Math.random() * mascots.length)] : w.look.mascot;
    const p = w.prizes[index];
    startSpin({ id: `demo${Date.now()}`, wheel: w, index, turns: 5, jitter: 0.2 + Math.random() * 0.6, mascot, user: { name: 'Satronho' }, reason: 'Prueba', spinMs: (w.look?.spinSeconds || 6) * 1000, showMs: (w.look?.showSeconds || 4) * 1000, result: { reto: Boolean(p.reto), again: ['wheel', 'respin'].includes(p.action?.type) } });
  }
  function showStatic(w) {
    wheel = w; currentSpin = null; anim = null;
    $('w-name').textContent = w.name || 'Ruleta';
    $('w-who').textContent = 'Lista para girar';
    document.body.classList.toggle('notitle', w.look?.title === false);
    const mascots = w.look?.mascots?.length ? w.look.mascots : PETS;
    setPet(!w.look?.mascot || w.look.mascot === 'random' ? mascots[0] : w.look.mascot);
    petState('');
    $('win').classList.remove('on');
    show(true);
  }
  listenPreview(() => demoSpin());
  window.addEventListener('message', (ev) => {
    if (ev.origin !== location.origin) return;
    if (ev.data?.satronhoWheel) { previewWheel = ev.data.satronhoWheel; if (!anim) showStatic(previewWheel); }
    if (ev.data?.satronhoWheelSpin) { window.__wheelSound = Boolean(ev.data.sound); demoSpin(); }
  });
  let demoTimer = null;
  if (isPreview) {
    showStatic(DEMO);
    if (param('demo', '1') !== '0') { setTimeout(() => demoSpin(), 600); demoTimer = setInterval(() => { if (!anim) demoSpin(); }, 11000); }
  }

  // ---------- En vivo ----------
  const results = new Map();
  applyOverlayStyle({});
  connectSatronho((kind, payload) => {
    if (kind === 'hello') applyOverlayStyle(payload.overlayStyle);
    if (kind === 'overlay-style') applyOverlayStyle(payload);
    if (isPreview) return;
    if (kind === 'wheel-spin') {
      const p = payload.wheel.prizes[payload.index];
      payload.result = results.get(payload.id) || {};
      startSpin(payload);
    }
    if (kind === 'wheel-landed' && currentSpin && payload.spinId === currentSpin.id) {
      currentSpin.result = { ...(currentSpin.result || {}), reto: payload.entry?.reto };
      if (payload.entry?.reto) { $('win-tag').hidden = false; $('win-tag').textContent = '¡Reto pendiente!'; }
    }
    if (kind === 'wheel-control' && payload.action === 'stop') { anim = null; speed = 0; currentSpin = null; show(false); }
    if (kind === 'wheel-queue') {
      const n = (payload.queue || []).length;
      $('queue').classList.toggle('on', n > 0);
      $('queue').textContent = `🎡 ${n} en fila`;
    }
  });
</script>
</body>
</html>
