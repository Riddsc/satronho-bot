# Publica la carpeta web/ en GitHub Pages: el enlace https que usa
# TikTok LIVE Studio para mostrar los overlays (https://riddsc.github.io/satronho-bot/o/).
# Requiere, una sola vez: Settings → Pages → Source: «GitHub Actions».
name: Página para TikTok LIVE Studio

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
