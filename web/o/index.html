<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="RiddsSatronho">
<meta name="robots" content="noindex">
<title>Satronho Bot · Overlay</title>
<!--
  Enlace https para TikTok LIVE Studio (no acepta http://127.0.0.1).
  Esta página no tiene datos: solo muestra, a pantalla completa y con fondo
  transparente, el overlay que sirve Satronho Bot en tu PC.
    ?p=/overlays/w.html?id=nowplaying   (ruta del overlay en la app)
    &port=3800                          (si cambiaste el puerto)
-->
<style>
  :root { color-scheme: normal; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal; }
</style>
</head>
<body>
<iframe id="f" title="Satronho Bot" allow="autoplay; clipboard-read; clipboard-write" allowtransparency="true"></iframe>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    // Solo los overlays de la app, y sus opciones como texto simple: este
    // enlace nunca debe mostrar el panel ni llevar código escondido.
    var PAGES = ['alerts', 'goal', 'now-playing', 'podium', 'w', 'wheel'];
    var path = '/overlays/alerts.html';
    var m = /^\/overlays\/([a-z-]+)\.html(\?[^#]*)?$/.exec(q.get('p') || '');
    if (m && PAGES.indexOf(m[1]) >= 0) {
      var clean = [];
      new URLSearchParams(m[2] || '').forEach(function (v, k) {
        if (/^[a-z]{1,20}$/i.test(k) && /^[\p{L}\p{N}\p{Emoji_Presentation} _.,:#%!¡¿?-]{0,80}$/u.test(v)) clean.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      });
      path = '/overlays/' + m[1] + '.html' + (clean.length ? '?' + clean.join('&') : '');
    }
    var port = String(Number(q.get('port')) || 3800);
    var base = 'http://127.0.0.1:' + port;
    var f = document.getElementById('f');
    var src = base + path;
    f.src = src;
    // Si la app estaba cerrada y luego se abre, el overlay se recarga solo.
    var down = false;
    setInterval(function () {
      fetch(base + '/api/ping', { mode: 'no-cors', cache: 'no-store' })
        .then(function () { if (down) { down = false; f.src = src + (src.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now(); } })
        .catch(function () { down = true; });
    }, 5000);
  })();
</script>
</body>
</html>
